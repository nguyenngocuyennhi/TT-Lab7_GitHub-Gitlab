<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - GitHub Actions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Lab7_Bài 1: Deploy tự động</h1>

        <p class="description">
            Ứng dụng HTML được quản lý bằng GitHub và tự động deploy
            lên hosting thông qua GitHub Actions.
        </p>

        <div class="status">
            <h2>DEPLOY TỰ ĐỘNG</h2>
            <p>GitHub Actions đã được cấu hình để tự động triển khai khi có thay đổi trên nhánh <b>main</b>.</p>

            <p>
                Trạng thái:
                <span class="success">Đã cấu hình</span>
            </p>

            <p>
                Thời gian deploy:
                <span id="deploy-time">Đang tải...</span>
            </p>
        </div>
    </div>

    <script>
        fetch("deploy-info.txt?time=" + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error("Không tìm thấy thông tin deploy");
                }
                return response.text();
            })
            .then(data => {
                document.getElementById("deploy-time").textContent = data;
            })
            .catch(() => {
                document.getElementById("deploy-time").textContent =
                    "Chưa có thông tin";
            });
    </script>

</body>
</html>
